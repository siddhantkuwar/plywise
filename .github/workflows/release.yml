name: Release qualification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0
      - run: chmod +x packaging/macos/package.sh packaging/macos/launcher packaging/macos/pct-data scripts/clean-install-smoke.sh
      - run: scripts/clean-install-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Personal-Chess-Tutor-macOS
          path: dist/Personal-Chess-Tutor-macOS.zip
          if-no-files-found: error
